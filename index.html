<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Mortgage repayment calculator</title>
  </head>
  <body>
    <section>
      <section>
        <div>
          <h3>Mortgage Calculator</h3>
          <h5>Clear All</h5>
        </div>
        <form action="">
          <label for="amount">Mortgage Amount</label>
          <input type="text" name="amount" id="amount" style="display: block" />
          <label for="term">Mortgage Term</label>
          <input type="text" name="term" id="term" />
          <label for="interest">Interest Rate</label>
          <input type="text" name="interest" id="interest" />
          <label for="mortgageType">Mortgage Type</label>
          <input type="radio" name="type" id="" /> repayment
          <input type="radio" name="type" id="" /> Interest Only
        </form>
        <button type="submit">
          <img src="./assets/images/icon-calculator.svg" alt="" />Calculate
          Repayments
        </button>
      </section>
      <section></section>
    </section>
  </body>
</html>
