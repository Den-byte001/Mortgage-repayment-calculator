<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Mortgage repayment calculator</title>
  </head>
  <body>
    <section>
      <section>
        <div>
          <h3>Mortgage Calculator</h3>
          <h5>Clear All</h5>
        </div>
        <form action="">
          <div>
            <label for="amount">Mortgage Amount</label>
            <input type="text" name="amount" id="amount" />
          </div>
          <div>
            <label for="term">Mortgage Term</label>
            <input type="text" name="term" id="term" />
          </div>
          <div>
            <label for="interest">Interest Rate</label>
            <input type="text" name="interest" id="interest" />
          </div>
          <label for="mortgageType">Mortgage Type</label>
          <div>
            <input type="radio" name="type" id="" />
            <label for="repaymentOnly">Repayment</label>
          </div>
          <div>
            <input type="radio" name="type" id="" />
            <label for="interestOnly">Interest Only</label>
          </div>
        </form>
        <button type="submit">
          <img src="./assets/images/icon-calculator.svg" alt="" />Calculate
          Repayments
        </button>
      </section>
      <section>
        <img
          src="./assets/images/illustration-empty.svg"
          alt="Calculator images"
        />
        <h2>Results shown here</h2>
        <p>
          Complete the form and click “calculate repayments” to see what your
          monthly repayments would be.
        </p>
      </section>
    </section>
  </body>
</html>
