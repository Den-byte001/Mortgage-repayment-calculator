<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Mortgage repayment calculator</title>
  </head>
  <body>
    <section class="genCard">
      <section class="firstSection">
        <div class="header">
          <h2>Mortgage Calculator</h2>
          <h3>Clear All</h3>
        </div>
        <form action="">
          <div class="amountInput">
            <label for="amount">Mortgage Amount</label>
            <div class="inputDiv">
              <span>&#8358;</span>
              <input type="number" name="amount" id="amount" />
            </div>
          </div>
          <div class="termRate">
            <div>
              <label for="term">Mortgage Term</label>
              <div class="termDiv">
                <input type="number" name="term" id="term" />
                <span>years</span>
              </div>
            </div>
            <div>
              <label for="interest">Interest Rate</label>
              <div class="interestDiv">
                <input type="number" name="interest" id="interest" />
                <span>%</span>
              </div>
            </div>
          </div>
          <label for="mortgageType" class="mortgageType">Mortgage Type</label>
          <div class="repaymentDiv">
            <input type="radio" name="type" id="" />
            <label for="repaymentOnly">Repayment</label>
          </div>
          <div class="interestOnlyDiv">
            <input type="radio" name="type" id="" />
            <label for="interestOnly">Interest Only</label>
          </div>
        </form>
        <button type="submit">
          <img src="./assets/images/icon-calculator.svg" alt="" />
          <div>Calculate Repayments</div>
        </button>
      </section>
      <section class="secondSection">
        <img
          src="./assets/images/illustration-empty.svg"
          alt="Calculator images"
        />
        <h2>Results shown here</h2>
        <p>
          Complete the form and click “calculate repayments” to see what your
          monthly repayments would be.
        </p>
      </section>
    </section>
  </body>
</html>
